name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # Until the Static Web App exists and its token is saved as a repo secret
      # there is nothing to deploy to. Skip rather than fail, so the repo does
      # not show a red run for a step that simply is not wired up yet.
      - name: Check for deployment token
        id: guard
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — skipping deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.guard.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The site is plain static files with no build step, so the repo root
          # is published as-is. The API is a different story: it must be built,
          # because @azure/cosmos comes from npm install and node_modules is not
          # committed — so skip_app_build is set but skip_api_build is not.
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tear down PR preview
    steps:
      - name: Close
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
